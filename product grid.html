<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Grid</title>

<style>
*{box-sizing:border-box;margin:0;font-family:sans-serif}
body{padding:20px;background:#f5f5f5}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}
.card{
  background:#fff;
  padding:15px;
  border-radius:8px;
  text-align:center;
  transition:.3s;
}
.card:hover{
  transform:scale(1.05);
  box-shadow:0 5px 15px rgba(0,0,0,.2);
}

.card img{
  width:100%;
  border-radius:5px;
}

button{
  margin-top:10px;
  padding:8px;
  border:none;
  background:#667eea;
  color:#fff;
  border-radius:5px;
  cursor:pointer;
}
@media(max-width:900px){
  .grid{grid-template-columns:repeat(2,1fr);}
}
@media(max-width:500px){
  .grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div class="grid">
  <div class="card">
    <img src="https://via.placeholder.com/150">
    <h3>Product 1</h3>
    <p>$10</p>
    <button>Buy</button>
  </div>
  <div class="card">
    <img src="https://via.placeholder.com/150">
    <h3>Product 2</h3>
    <p>$20</p>
    <button>Buy</button>
  </div>
  <div class="card">
    <img src="https://via.placeholder.com/150">
    <h3>Product 3</h3>
    <p>$30</p>
    <button>Buy</button>
  </div>
  <div class="card">
    <img src="https://via.placeholder.com/150">
    <h3>Product 4</h3>
    <p>$40</p>
    <button>Buy</button>
  </div>
  <div class="card">
    <img src="https://via.placeholder.com/150">
    <h3>Product 5</h3>
    <p>$50</p>
    <button>Buy</button>
  </div>
  <div class="card">
    <img src="https://via.placeholder.com/150">
    <h3>Product 6</h3>
    <p>$60</p>
    <button>Buy</button>
  </div>
</div>
</body>
</html>
